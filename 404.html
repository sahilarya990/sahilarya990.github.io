<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Page not found · Sahil Das</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<meta name="theme-color" content="#08050f" />
<style>
  /* padding-block only — the inline gutter belongs to .wrap */
  .nf{min-height:100svh;display:grid;align-content:center;gap:1.25rem;padding-block:7rem;position:relative}
  .nf__code{font-size:clamp(3.5rem,10vw,7rem);font-weight:300;letter-spacing:-.05em;
    line-height:.9;color:var(--text-3)}
  .nf h1{font-size:var(--fs-sec);max-width:20ch}
  .nf p{color:var(--text-2);max-width:46ch}
  .nf__act{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.25rem}
  .nf__rule{height:1px;background:var(--line);margin:.5rem 0}
  /* No burger on this page, so the CTA stays visible at every width */
  .nav__end .nav__cta{display:inline-flex}
</style>
</head>
<body>

<div class="amb" aria-hidden="true">
  <span class="orb orb--1"></span>
  <span class="orb orb--2"></span>
</div>

<header class="nav stuck">
  <div class="nav__in">
    <a href="/" class="brand">Sahil Das</a>
    <div class="nav__end">
      <a class="nav__cta" href="mailto:founder@helprevx.com">Let's talk <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</header>

<main class="wrap nf">
  <p class="eyebrow"><span>404</span> Page not found</p>
  <div class="nf__code">404</div>
  <div class="nf__rule"></div>
  <h1>This page went back to the sketchbook.</h1>
  <p>The link you followed doesn't exist, or it moved during a redesign. Let's get you back to something that does.</p>
  <div class="nf__act">
    <a href="/" class="btn btn--fill">Back to home
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <a href="/#work" class="btn btn--out">See the work</a>
  </div>
</main>

<footer class="foot">
  <div class="wrap foot__in">
    <p class="foot__name">Sahil Das</p>
    <p class="foot__c">© 2026 Sahil Das</p>
  </div>
</footer>

</body>
</html>
